<!-- @dsCard group="Components" viewport="700x340" name="Atlas — prints, stacks, rings, legend" subtitle="Colour print / mono print / blank frame on torn ground" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    html, body { margin: 0; background: var(--paper-1); }
    body { font: var(--body); color: var(--text-body); padding: 18px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .eyebrow { font: var(--eyebrow); letter-spacing: var(--eyebrow-tracking); text-transform: uppercase; color: var(--text-quiet); }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Print, FrameStack, RingLabel, Legend, TornGround, GrainOverlay } = window.RISO1;
    function Demo() {
      return (
        <div className="col">
          <div className="row" style={{ gap: 18, alignItems: 'flex-end' }}>
            <Print state="loved" src="../../assets/photo-stack.jpeg" caption="Krapina" tape star pin tilt={-4} width={96} height={70} />
            <Print state="fine" src="../../assets/collage.jpeg" caption="Ludbreg" pin tilt={3} edge={1} width={88} height={64} />
            <Print state="unprinted" pin tilt={-2} width={60} height={46} />
            <FrameStack count={4} />
            <RingLabel tilt={-4}>2 H</RingLabel>
            <RingLabel tilt={3}>1 H</RingLabel>
          </div>
          <div className="row" style={{ alignItems: 'flex-start', gap: 14 }}>
            <div style={{ position: 'relative', width: 320, height: 150, border: 'var(--stroke)', overflow: 'hidden' }}>
              <TornGround fragments={['../../assets/collage2.webp', '../../assets/collage.jpeg', '../../assets/photo-stack.jpeg']} />
              <GrainOverlay />
            </div>
            <Legend counts={{ loved: 31, fine: 11, unprinted: 74 }} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
