<!-- @dsCard group="Components" viewport="700x400" name="Shell — top bar, index, frame card" subtitle="One bar of chrome, one panel slot" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    html, body { margin: 0; background: var(--paper-1); }
    body { font: var(--body); color: var(--text-body); padding: 18px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .eyebrow { font: var(--eyebrow); letter-spacing: var(--eyebrow-tracking); text-transform: uppercase; color: var(--text-quiet); }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { TopBar, IndexPanel, FrameCard, ContactSheet } = window.RISO1;
    const rows = [
      { key: 'loved', label: 'Printed · loved', count: 31, checked: true, swatch: { background: 'var(--pink)', border: 'var(--stroke-hair)' } },
      { key: 'fine', label: 'Printed · fine', count: 11, checked: false, swatch: { background: 'var(--state-fine)', border: 'var(--stroke-hair)' } },
      { key: 'unprinted', label: 'Not printed', count: 74, checked: true, swatch: { border: '1.5px dashed var(--blue)' } },
    ];
    function Demo() {
      return (
        <div className="col" style={{ gap: 16 }}>
          <div style={{ border: 'var(--stroke)' }}>
            <TopBar brand="The Atlas" meta="Zagreb · 42 printed / 74 not" filterCount={2} />
          </div>
          <div className="row" style={{ alignItems: 'flex-start', gap: 14 }}>
            <IndexPanel rows={rows} footerCount={105} style={{ width: 300 }} />
            <FrameCard name={'Sveti Križ\nZačretje'} state="unprinted"
              description="A restored manor house and a pleasant little town centre."
              driveTime="52 min" distance="49 km" stay="~45 min"
              tags={['Croatia', 'Castle', 'Small town']} style={{ width: 280 }} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
