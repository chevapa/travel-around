<!-- @dsCard group="Brand" viewport="700x160" subtitle="No icon font: single Unicode characters in Space Mono" name="Glyph set" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">⌕</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">✕</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">★</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">↗</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">→</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">◠</span>
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">?</span>
    <!-- Issue 157: "home" glyph for the map's back-to-home-area button — added per readme.md's "take another Unicode glyph before reaching for a library" rule. -->
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">⌂</span>
    <!-- Issue 141: "save for later" glyph on the recommendation screen. -->
    <span style="width:44px;height:44px;border:var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:17px;color:var(--ink)">↓</span>
  </div>
  <div style="margin-top:10px;font:var(--label-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)">Never emoji</div>
</body>
</html>
