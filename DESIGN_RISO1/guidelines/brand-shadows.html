<!-- @dsCard group="Brand" viewport="700x180" subtitle="Hard, opaque, never blurred; radius is always 0" name="Offset shadows" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <span style="width:90px;height:56px;background:var(--paper-2);border:var(--stroke-heavy);box-shadow:var(--lift-1)"></span>
    <span style="width:90px;height:56px;background:var(--paper-2);border:var(--stroke-heavy);box-shadow:var(--lift-2)"></span>
    <span style="width:90px;height:56px;background:var(--paper-2);border:var(--stroke-heavy);box-shadow:var(--lift-3)"></span>
    <span style="width:90px;height:56px;background:var(--paper-2);border:var(--stroke-heavy);box-shadow:var(--lift-4)"></span>
  </div>
</body>
</html>
