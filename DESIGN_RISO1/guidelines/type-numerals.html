<!-- @dsCard group="Type" viewport="700x150" subtitle="Space Mono for every count, distance and drive time" name="Numerals" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="font:var(--numeral);background:var(--ink);color:var(--text-on-invert);padding:5px 8px;letter-spacing:.1em">52 MIN · 49 KM</span>
    <span style="font:var(--numeral);border:var(--stroke);padding:4px 8px;letter-spacing:.1em">STAY ~45 MIN</span>
    <span style="font:var(--numeral);background:var(--yellow);border:var(--stroke);padding:2px 8px">1 H</span>
    <span style="font:var(--numeral);color:var(--ink-55)">31 / 11 / 74</span>
  </div>
</body>
</html>
