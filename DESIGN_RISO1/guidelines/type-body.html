<!-- @dsCard group="Type" viewport="700x200" subtitle="Bricolage Grotesque regular — lede 21, body 16, small 15" name="Body" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <p style="margin:0 0 8px;font:var(--lede);color:var(--text-body);max-width:56ch">A place you've been is a print. A place you haven't is a frame still on the roll.</p>
  <p style="margin:0;font:var(--body);color:var(--text-body);max-width:64ch">The atlas is the sheet of paper they're stuck to — and the land itself is torn out of other photographs.</p>
</body>
</html>
