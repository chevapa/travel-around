<!-- @dsCard group="Brand" viewport="700x170" subtitle="One halftone screen over the whole composition — never per element" name="Grain" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="position:relative;height:110px;background:var(--paper-3);border:var(--stroke);overflow:hidden">
    <span style="position:absolute;left:-10%;top:20%;width:70%;height:70%;background:var(--green);opacity:.4;border-radius:52% 48% 60% 40%;mix-blend-mode:multiply"></span>
    <span style="position:absolute;right:6%;top:10%;width:40%;height:60%;background:var(--pink);opacity:.5;border-radius:50%;mix-blend-mode:multiply"></span>
    <span style="position:absolute;inset:0;background-image:var(--grain-image);background-size:var(--grain-size);opacity:var(--grain-opacity);mix-blend-mode:multiply"></span>
  </div>
</body>
</html>
