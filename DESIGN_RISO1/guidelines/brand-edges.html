<!-- @dsCard group="Brand" viewport="700x200" subtitle="Three clip-paths; vary them between neighbours" name="Torn print edges" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:18px;align-items:flex-end">
    <span style="width:104px;height:74px;background:#fff;box-shadow:var(--lift-print);clip-path:polygon(2% 3%,42% 0%,74% 4%,100% 1%,98% 44%,100% 82%,97% 100%,58% 97%,22% 100%,1% 96%,3% 52%)"></span>
    <span style="width:104px;height:74px;background:#fff;box-shadow:var(--lift-print);clip-path:polygon(3% 1%,40% 4%,72% 0%,100% 3%,96% 42%,100% 76%,95% 100%,60% 96%,26% 100%,2% 96%,5% 44%)"></span>
    <span style="width:104px;height:74px;background:#fff;box-shadow:var(--lift-print);clip-path:polygon(2% 2%,44% 0%,76% 4%,100% 1%,97% 40%,100% 74%,98% 100%,56% 97%,24% 100%,1% 97%,3% 46%)"></span>
  </div>
</body>
</html>
