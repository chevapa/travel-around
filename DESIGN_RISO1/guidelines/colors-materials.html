<!-- @dsCard group="Colors" viewport="700x160" subtitle="Tape, grain and the hatch fill of an empty frame" name="Materials" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div class="row">
  <div class="sw"><b style="background:var(--tape);"></b><span>--tape</span><em>rgba(255,210,0,.72)</em></div>
  <div class="sw"><b style="background:var(--paper-2);background-image:var(--grain-image);background-size:var(--grain-size)"></b><span>--grain</span><em>halftone dots</em></div>
  <div class="sw"><b style="background:var(--paper-1);background-image:var(--hatch)"></b><span>--hatch</span><em>45° hatch</em></div>
  </div>
</body>
</html>
