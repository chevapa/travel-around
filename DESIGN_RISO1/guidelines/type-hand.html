<!-- @dsCard group="Type" viewport="700x160" subtitle="Caveat — captions on prints only, never UI" name="Handwriting" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:22px;align-items:baseline">
    <span style="font:var(--hand);color:var(--blue)">Plitvice '24</span>
    <span style="font:var(--hand);color:var(--ink-40)">it was fine</span>
    <span style="font:var(--hand);color:var(--pink);font-size:30px">4</span>
  </div>
</body>
</html>
