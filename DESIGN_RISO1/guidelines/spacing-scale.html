<!-- @dsCard group="Spacing" viewport="700x170" subtitle="A loose, non-geometric ramp — copy the value, do not snap to 8" name="Scale" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;gap:8px;align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:5px;height:5px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">5</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:8px;height:8px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">8</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:11px;height:11px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">11</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:14px;height:14px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">14</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:16px;height:16px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">16</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:22px;height:22px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">22</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:26px;height:26px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">26</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:40px;height:40px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">40</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="display:block;width:64px;height:64px;background:var(--ink)"></span><span style="font:var(--label-sm);color:var(--ink-40)">64</span></div>
  </div>
</body>
</html>
