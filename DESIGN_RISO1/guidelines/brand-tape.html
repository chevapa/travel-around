<!-- @dsCard group="Brand" viewport="700x160" subtitle="Translucent yellow with dashed torn edges; only on loved prints" name="Tape" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="position:relative;padding-top:18px">
    <span style="display:block;width:120px;height:74px;background:#fff;box-shadow:var(--lift-print);clip-path:polygon(2% 3%,42% 0%,74% 4%,100% 1%,98% 44%,100% 82%,97% 100%,58% 97%,22% 100%,1% 96%,3% 52%)"></span>
    <span style="position:absolute;top:8px;left:32px;width:58px;height:20px;background:var(--tape);border-left:1px dashed rgba(25,21,16,.35);border-right:1px dashed rgba(25,21,16,.35);transform:rotate(2deg)"></span>
  </div>
</body>
</html>
