<!-- @dsCard group="Colors" viewport="700x150" subtitle="Flat and unmixed — green is landcover only, never UI" name="The three inks" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div class="row">
  <div class="sw"><b style="background:var(--pink);"></b><span>--pink</span><em>#FF2E86</em></div>
  <div class="sw"><b style="background:var(--blue);"></b><span>--blue</span><em>#1F4FD8</em></div>
  <div class="sw"><b style="background:var(--yellow);"></b><span>--yellow</span><em>#FFD200</em></div>
  <div class="sw"><b style="background:var(--green);"></b><span>--green</span><em>#8FBF4A</em></div>
  </div>
</body>
</html>
