<!-- @dsCard group="Type" viewport="700x220" subtitle="Bricolage Grotesque 800, uppercase, −.045em, sub-1 leading" name="Display" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="font:var(--display-2);letter-spacing:var(--display-tracking);text-transform:uppercase;color:var(--ink)">Printed<br /><span style="color:var(--blue)">Not printed</span></div>
  <div style="margin-top:10px;font:var(--label-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40)">--display-1 / --display-2 / --display-3</div>
</body>
</html>
