<!-- @dsCard group="Colors" viewport="700x170" subtitle="The core semantic: colour / mono / unprinted" name="Print states" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div class="row">
  <div class="sw"><b style="background:var(--state-loved);"></b><span>--state-loved</span><em>printed · loved</em></div>
  <div class="sw"><b style="background:var(--state-fine);"></b><span>--state-fine</span><em>printed · fine</em></div>
  <div class="sw"><b style="background:transparent;border:2px dashed var(--blue);background-image:var(--hatch)"></b><span>--state-unprinted</span><em>not printed</em></div>
  </div>
</body>
</html>
