<!-- @dsCard group="Type" viewport="700x180" subtitle="Space Mono 700, uppercase — all UI chrome sets in this" name="Label & eyebrow" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span style="font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase;color:var(--text-quiet)">01 — The Atlas</span>
    <span style="font:var(--label);letter-spacing:var(--label-tracking);text-transform:uppercase;color:var(--ink)">New Frame · The Index · To Print</span>
    <span style="font:var(--label-sm);letter-spacing:var(--label-tracking);text-transform:uppercase;background:var(--ink);color:var(--text-on-invert);padding:4px 8px;align-self:flex-start">Zagreb · 42 printed / 74 not</span>
  </div>
</body>
</html>
