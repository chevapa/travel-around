<!-- @dsCard group="Colors" viewport="700x150" subtitle="Three weights of one warm sheet, plus print white" name="Paper stock" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { margin: 0; }
    body { background: var(--paper-1); color: var(--text-body); font: var(--body); padding: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sw { display: flex; flex-direction: column; gap: 4px; }
    .sw b { display: block; width: 92px; height: 52px; border: var(--stroke); }
    .sw span { font: var(--label-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-55); }
    .sw em { font: var(--label-sm); font-style: normal; color: var(--ink-40); }
  </style>
</head>
<body>
  <div class="row">
  <div class="sw"><b style="background:var(--paper-1);"></b><span>--paper-1</span><em>#EFE7D2</em></div>
  <div class="sw"><b style="background:var(--paper-2);"></b><span>--paper-2</span><em>#F6F0DE</em></div>
  <div class="sw"><b style="background:var(--paper-3);"></b><span>--paper-3</span><em>#E7DCC0</em></div>
  <div class="sw"><b style="background:var(--paper-print);"></b><span>--paper-print</span><em>#FFFFFF</em></div>
  </div>
</body>
</html>
