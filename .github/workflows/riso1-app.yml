name: RISO1 app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/riso1-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/riso1-app.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: No raw hex colours in components (RISO1 ground rule)
        run: npm run lint:hex
      - name: No emoji in src/ — only the seven approved chrome glyphs (Task 12)
        run: npm run lint:emoji
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
