<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---------- CATEGORIES ----------
const CATEGORIES = {
  town:{label:'Город / городок', ico:'<img class="cat-icon-img" src="assets/img014.png" alt="">'},
  castle:{label:'Замок / крепость', ico:'<img class="cat-icon-img" src="assets/img015.png" alt="">'},
  museum:{label:'Музей / этнография', ico:'<img class="cat-icon-img" src="assets/img016.png" alt="">'},
  church:{label:'Церковь / сакральное', ico:'<img class="cat-icon-img" src="assets/img017.png" alt="">'},
  nature:{label:'Природа / хайк', ico:'<img class="cat-icon-img" src="assets/img018.png" alt="">'},
  view:{label:'Смотровая', ico:'<img class="cat-icon-img" src="assets/img019.png" alt="">'},
  water:{label:'Озеро / река', ico:'<img class="cat-icon-img" src="assets/img020.png" alt="">'},
  cave:{label:'Пещера', ico:'<img class="cat-icon-img" src="assets/img021.png" alt="">'},
  beach:{label:'Пляж / море', ico:'<img class="cat-icon-img" src="assets/img022.png" alt="">'},
  food:{label:'Еда / вино', ico:'<img class="cat-icon-img" src="assets/img023.png" alt="">'},
  bike:{label:'Велотема', ico:'<img class="cat-icon-img" src="assets/img024.png" alt="">'},
  spa:{label:'Термы', ico:'<img class="cat-icon-img" src="assets/img025.png" alt="">'},
  culture:{label:'Культура / история', ico:'<img class="cat-icon-img" src="assets/img016.png" alt="">'},
};
// Заглушка для незнакомой/опечатанной категории — чтобы одна плохая точка
// не ломала отрисовку остальных мест.
function catInfo(c){ return CATEGORIES[c] || {label:c, ico:'❔'}; }
function countryInfo(cc){ return COUNTRIES[cc] || {flag:'🏳️', label:cc, local:cc}; }
function statusInfo(cat){ return STATUSES[cat] || {label:cat, color:'#888', badge:'grey'}; }
function seasonInfo(s){ return SEASONS[s] || {label:s, ico:'📅'}; }

const COUNTRIES = {
  hr: {label:'Хорватия',  flag:'🇭🇷', local:'Hrvatska'},
  si: {label:'Словения',  flag:'🇸🇮', local:'Slovenija'},
  it: {label:'Италия',    flag:'🇮🇹', local:'Italia'},
  hu: {label:'Венгрия',   flag:'🇭🇺', local:'Magyarország'},
  mk: {label:'Сев. Македония', flag:'🇲🇰', local:'Северна Македонија'},
  ba: {label:'Босния и Герцеговина', flag:'🇧🇦', local:'Bosna i Hercegovina'},
  me: {label:'Черногория', flag:'🇲🇪', local:'Crna Gora'},
  rs: {label:'Сербия',    flag:'🇷🇸', local:'Srbija'},
  al: {label:'Албания',   flag:'🇦🇱', local:'Shqipëria'},
};

const SEASONS = {
  all:    {label:'Круглый год',        ico:'🗓'},
  warm:   {label:'Тепло (апр–окт)',    ico:'🌤'},
  summer: {label:'Лето / купание',     ico:'☀️'},
  stork:  {label:'Аисты (март–авг)',   ico:'🕊'},
};

const STATUSES = {
  loved: {label:'Понравилось',          color:'#1F8C82', badge:'green'},
  ok:    {label:'Так себе / нейтрально', color:'#FF5A2B', badge:'amber'},
  plan:  {label:'Ещё не были (план)',    color:'#6E4FA0', badge:'grey'},
};

const SOURCES = {
  journal:  {label:'Мой дневник поездок',        ico:'📔'},
  research: {label:'Подборка / ИИ-ресёрч',       ico:'🔎'},
};
// Места без явного src (напр. дропнутые в places/ файлы без этого поля)
// по умолчанию считаются "ресёрчем" — неподтверждённая подборка, не личный опыт.
// Места, добавленные вручную через карту (custom:true), считаются личными
// (как дневник), даже если явный src не указан.
function sourceKey(p){
  if(p.src === 'journal') return 'journal';
  if(p.custom) return 'journal';
  return 'research';
}

// ---------- DATA ----------
// ---------- DATA ----------
// Базовый набор мест больше НЕ хранится здесь построчно.
// Он подгружается асинхронно из репозитория GitHub — файлы
// places/base-visited-loved.json, base-visited-ok.json,
// base-plans.json, base-research-east.json (см. loadBasePlaces() ниже).
// Пользовательские точки (custom:true) — из localStorage (loadCustom()).
// Точки из места-файлов сообщества — из папки places/ (loadFolderPlaces()).
const PLACES = [];

// ---------- STATE ----------
const state = {
  statuses: new Set(Object.keys(STATUSES)),
  cats: new Set(Object.keys(CATEGORIES)),
  countries: new Set(Object.keys(COUNTRIES)),
  seasons: new Set(Object.keys(SEASONS)),
  sources: new Set(['journal']), // по умолчанию видно только личный дневник
  onlyReturn: false,
  showReturnBadge: true,
  query: "",
};

// ---------- MAP ----------
const map = L.map('map', {zoomControl:false}).setView([45.85, 15.60], 8);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
const markerRefs = [];
const driveTimeCache = {};
let placeIdCounter = 0;

function buildMarker(place){
  const color = statusInfo(place.cat).color;
  const html = `<div class="pin-wrap">
      <div class="pin-dot" style="background:${color}"></div>
      ${place.wantReturn ? `<div class="pin-badge">★</div>` : ''}
    </div>`;
  const icon = L.divIcon({html, className:'', iconSize:[28,28], iconAnchor:[14,18], popupAnchor:[0,-20]});
  const marker = L.marker([place.lat,place.lng], {icon});
  const st = statusInfo(place.cat);
  const starMark = place.wantReturn ? ' <span class="star-mark">★</span>' : '';
  const driveId = `dt-${placeIdCounter++}`;
  const catBadges = place.cats.slice(0,3).map(c=>
    `<span class="popup-badge cat"><span class="cat-art">${catInfo(c).ico}</span>${catInfo(c).label.replace(' / ',' · ')}</span>`).join('');
  const countryBadge = `<span class="popup-badge cat">${countryInfo(place.country).flag} ${countryInfo(place.country).label}</span>`;
  const seasonBadge = place.season!=='all'
    ? `<span class="popup-badge cat">${seasonInfo(place.season).ico} ${seasonInfo(place.season).label}</span>` : '';
  const warnBlock = place.warn ? `<p class="popup-warn">⚠️ ${place.warn}</p>` : '';
  const editBlock = '';
  const sourceBlock = sourceKey(place) === 'journal'
    ? `<p class="popup-source">📔 Источник: мой дневник поездок</p>`
    : `<p class="popup-source">🔎 Источник: подборка (ИИ-ресёрч по моим предпочтениям)</p>`;
  const searchQ = encodeURIComponent(`${place.q || place.name} ${countryInfo(place.country).local}`);
  const searchUrl = `https://www.google.com/search?q=${searchQ}`;
  marker.bindPopup(
    `<div class="popup-badges"><span class="popup-badge ${st.badge}">${st.label}</span>${countryBadge}${seasonBadge}${catBadges}</div>` +
    `<p class="popup-title"><a href="${searchUrl}" target="_blank" rel="noopener" class="title-link">${place.name}<svg class="ext-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg></a>${starMark}</p>` +
    `<p class="popup-note">${place.note}</p>` +
    warnBlock +
    (place.meta ? `<p class="popup-meta">${place.meta}</p>` : '') +
    sourceBlock +
    `<p class="popup-drivetime" id="${driveId}">🚗 время в пути: <span class="dt-value">${place.drive}</span></p>` +
    `<div class="nearby-box"><button class="nearby-btn" data-name="${place.name}">Что рядом →</button><div class="nearby-out"></div></div>` +
    editBlock
  );
  marker.on('popupopen', ()=>loadDriveTime(place, driveId));
  marker.on('add', ()=>{
    const el = marker.getElement();
    const b = el && el.querySelector('.pin-badge');
    if(b) b.classList.toggle('hidden', !state.showReturnBadge);
  });
  markerRefs.push({place, marker});
}
PLACES.forEach(buildMarker);

function visiblePlaces(){
  const q = state.query.trim().toLowerCase();
  return PLACES.filter(p=>{
    const text = [p.name,p.q,p.note,p.meta].filter(Boolean).join(" ").toLowerCase();
    return state.statuses.has(p.cat) &&
      state.countries.has(p.country) &&
      state.seasons.has(p.season) &&
      state.sources.has(sourceKey(p)) &&
      p.cats.some(c=>state.cats.has(c)) &&
      (!state.onlyReturn || p.wantReturn) &&
      (!q || text.includes(q));
  });
}

function refresh(){
  const visible = new Set(visiblePlaces());
  markersLayer.clearLayers();
  markerRefs.forEach(({place, marker})=>{
    if(visible.has(place)) markersLayer.addLayer(marker);
  });
  renderList([...visible]);
  updateCounts();
}

// ---------- DRIVING TIME ----------
// Время в пути зашито вручную (реалистичные значения для оптимальных условий).
// OSRM ниже используется только как уточнение, если сеть доступна.
async function loadDriveTime(place, driveId){
  const base = BASE_POINTS[document.getElementById('base-select').value];
  const cacheKey = `${base.name}::${place.name}`;
  const el = document.getElementById(driveId);
  if(!el) return;
  if(driveTimeCache[cacheKey]){
    el.querySelector('.dt-value').textContent = driveTimeCache[cacheKey];
    return;
  }
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${base.lng},${base.lat};${place.lng},${place.lat}?overview=false`;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 5000);
    const res = await fetch(url, {signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('bad');
    const data = await res.json();
    if(!data.routes || !data.routes.length) throw new Error('none');
    const s = data.routes[0].duration, km = Math.round(data.routes[0].distance/1000);
    const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
    const str = (h>0 ? `${h} ч ${m} мин` : `${m} мин`) + ` (${km} км по дорогам)`;
    driveTimeCache[cacheKey] = str;
    const cur = document.getElementById(driveId);
    if(cur){
      cur.querySelector('.dt-value').textContent = str;
      cur.classList.remove('dt-error');
    }
  }catch(err){
    // сеть недоступна — остаётся зашитое значение, ничего не меняем
  }
}

// ---------- RINGS ----------
const BASE_POINTS = { zagreb:{name:'Загреб', lat:45.8150, lng:15.9819} };
// Расстояния ПО ПРЯМОЙ (не по дорогам), откалиброванные по реальному времени:
//  1ч — Вараждин 1:05 (61км) · Ново-Место 54мин (63км) · Кутина 55мин (72км) · Караловац 50мин (47км)
//  2ч — Грац 2:00 (146км) · Постойна 1:58 (137км) · Плитвице 2:00 (107км) · Слав.Брод 1:50 (175км)
//  3ч — Задар 3:00 (197км) · Удине 3:00 (214км) · Осиек 2:50 (213км)
const RING_DATA = { zagreb:[
  {label:'~1 ч', N:61,  E:72,  S:47,  W:63},
  {label:'~2 ч', N:146, E:180, S:107, W:137},
  {label:'~3 ч', N:200, E:225, S:197, W:214},
]};
let baseMarker = null, radiusShapes = [];

function smoothLerp(a,b,t){ const s=t*t*(3-2*t); return a+(b-a)*s; }
function destPoint(lat0,lng0,km,brg){
  const r=brg*Math.PI/180, latR=lat0*Math.PI/180;
  return [lat0 + (km*Math.cos(r))/111.32, lng0 + (km*Math.sin(r))/(111.32*Math.cos(latR))];
}
function ovalPoints(c,d,steps=144){
  const pts=[];
  for(let i=0;i<steps;i++){
    const b=i*360/steps;
    let km;
    if(b<=90) km=smoothLerp(d.N,d.E,b/90);
    else if(b<=180) km=smoothLerp(d.E,d.S,(b-90)/90);
    else if(b<=270) km=smoothLerp(d.S,d.W,(b-180)/90);
    else km=smoothLerp(d.W,d.N,(b-270)/90);
    pts.push(destPoint(c.lat,c.lng,km,b));
  }
  return pts;
}
function drawBase(key){
  const base = BASE_POINTS[key], rings = RING_DATA[key]||[];
  radiusShapes.forEach(s=>map.removeLayer(s));
  radiusShapes = [];
  if(baseMarker) map.removeLayer(baseMarker);
  rings.forEach(ring=>{

// Универсальное хранилище: window.storage (артефакт) или localStorage (GitHub Pages/локально)
const store = {
  async set(k,v){
    if(window.storage) return window.storage.set(k,v);
    localStorage.setItem(k,v);
  },
  async get(k){
    if(window.storage) return window.storage.get(k);
    const v = localStorage.getItem(k);
    return v==null ? null : {value:v};
  }
};

async function saveCustom(){

async function loadCustom(){

    const r = await store.get(STORAGE_KEY);

}

// ---------- БАЗОВЫЙ НАБОР МЕСТ (places/base-*.json) ----------
// Раньше это был хардкодный массив прямо в index.html. Теперь это 4 файла
// в папке places/ репозитория — грузятся напрямую по raw-ссылке (CDN,
// без обращения к ограниченному по частоте GitHub Contents API), поэтому
// показ базового набора не зависит от лимита запросов, который делится
// с автоподхватом пользовательских файлов ниже (loadFolderPlaces).
const BASE_FILES = [
  'base-visited-loved.json',
  'base-visited-ok.json',
  'base-plans.json',
  'base-research-east.json',
];
const RAW_BASE = 'https://raw.githubusercontent.com/chevapa/travel-around/main/places/';

async function loadBasePlaces(){
  try{
    const results = await Promise.all(BASE_FILES.map(async name => {
      try{
        const r = await fetch(RAW_BASE + name);
        return r.ok ? await r.json() : null;
      }catch(e){ return null; }
    }));
    let added = 0;
    results.forEach(data => {
      if(!Array.isArray(data)) return;
      data.forEach(p => {
        if(p && p.name && typeof p.lat === 'number' && typeof p.lng === 'number'){
          PLACES.push(p);
          added++;
        }
      });
    });
    if(added) rebuildMarkers();
    console.info(`places/base-*.json: загружено ${added} точек`);
  }catch(e){ /* нет сети — карта останется пустой до восстановления соединения */ }
}

// ---------- ОБЩИЕ МЕСТА ИЗ ПАПКИ places/ В РЕПОЗИТОРИИ ----------
// Любой .json-файл, положенный в папку places/ на GitHub (drag&drop + Commit),
// подхватывается автоматически при загрузке страницы — редактировать
// массив PLACES вручную не нужно. Файлы, начинающиеся с "_", игнорируются
// (используются под шаблон/примеры), как и файлы из BASE_FILES выше —
// они уже загружены напрямую через loadBasePlaces(). Файл может содержать
// один объект-место или массив таких объектов — поля те же, что раньше
// были в PLACES (см. README).
const FOLDER_API = 'https://api.github.com/repos/chevapa/travel-around/contents/places';

async function loadFolderPlaces(){
  try{
    const res = await fetch(FOLDER_API);
    if(!res.ok) return; // папки нет, лимит API GitHub исчерпан и т.п. — молча пропускаем
    const files = await res.json();
    if(!Array.isArray(files)) return;

    const jsonFiles = files.filter(f =>
      f.type === 'file' && f.name.endsWith('.json') &&
      !f.name.startsWith('_') && !BASE_FILES.includes(f.name));

    const results = await Promise.all(jsonFiles.map(async f => {
      try{
        const r = await fetch(f.download_url);
        return r.ok ? await r.json() : null;
      }catch(e){ return null; }
    }));

    let added = 0;
    results.forEach(data => {
      if(!data) return;
      const items = Array.isArray(data) ? data : [data];
      items.forEach(p => {
        if(p && p.name && typeof p.lat === 'number' && typeof p.lng === 'number'){
          p.src = p.src || 'folder';
          PLACES.push(p);
          added++;
        }
      });
    });

    if(added){ rebuildMarkers(); console.info(`places/: подхвачено ${added} точек`); }
  }catch(e){ /* нет сети / репозиторий приватный / лимит API — не критично, просто пропускаем */ }
}

// ---------- ЛЕНИВЫЙ ПОИСК СОСЕДЕЙ (OSRM /table, sources=0) ----------
// Полную матрицу 79×79 не строим. При клике на «Что рядом» делаем ОДИН запрос
// от выбранной точки ко всем кандидатам в радиусе, результат кешируем навсегда.
const ROUTE_CACHE_KEY = 'trip-atlas-route-cache';
let routeCache = {};
const NEARBY_RADIUS_KM = 70;   // дальше комбинировать в один день смысла нет
const MAX_CANDIDATES  = 45;    // с запасом под лимит демо-сервера

function airKm(a, b){
  const dLat=(b.lat-a.lat)*111.32;
  const dLng=(b.lng-a.lng)*111.32*Math.cos(a.lat*Math.PI/180);
  return Math.hypot(dLat,dLng);
}
function fmtMin(m){
  const h=Math.floor(m/60), mm=Math.round(m%60);
  return h>0 ? `${h} ч ${mm} мин` : `${mm} мин`;
}

async function saveRouteCache(){
  try{ await store.set(ROUTE_CACHE_KEY, JSON.stringify(routeCache)); }
  catch(e){ /* хранилище недоступно — кеш живёт до перезагрузки */ }
}
async function loadRouteCache(){
  try{
    const r = await store.get(ROUTE_CACHE_KEY);
    if(r && r.value) routeCache = JSON.parse(r.value) || {};
  }catch(e){ /* первого запуска ещё не было */ }
}

// Возвращает [{place, min, estimated}] отсортированные по времени
async function nearbyTimes(origin){
  const candidates = visiblePlaces()
    .filter(p => p !== origin && airKm(origin, p) <= NEARBY_RADIUS_KM)
    .sort((a,b) => airKm(origin,a) - airKm(origin,b))
    .slice(0, MAX_CANDIDATES);
  if(!candidates.length) return [];

  const cached = routeCache[origin.name] || {};
  const missing = candidates.filter(p => cached[p.name] === undefined);

  if(missing.length){
    try{
      const coords = [origin, ...missing].map(p=>`${p.lng},${p.lat}`).join(';');
      const dest = missing.map((_,i)=>i+1).join(';');
      const url = `https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&destinations=${dest}&annotations=duration`;
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 9000);
      const res = await fetch(url, {signal:ctrl.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('bad');
      const data = await res.json();
      const row = data.durations && data.durations[0];
      if(!row) throw new Error('no durations');
      missing.forEach((p,i)=>{
        if(row[i]!=null) cached[p.name] = Math.round(row[i]/60);
      });
      routeCache[origin.name] = cached;
      saveRouteCache();
    }catch(err){
      // сеть недоступна — оценка по прямой с поправкой на извилистость
      missing.forEach(p=>{
        const km = airKm(origin,p);
        const kmh = km<40 ? 42 : km<80 ? 58 : 68;
        cached[p.name] = Math.round(km/kmh*60);
        cached['__est_'+p.name] = true;
      });
      routeCache[origin.name] = cached;
    }
  }

  return candidates
    .map(p=>({place:p, min:cached[p.name], estimated:!!cached['__est_'+p.name]}))
    .filter(x=>x.min!=null)
    .sort((a,b)=>a.min-b.min);
}

  searchEl.value = '';
  document.querySelectorAll('#controls input[type=checkbox]').forEach(i=>{i.checked=true;i.closest('.check')?.classList.remove('off');});
  sourceList.querySelectorAll('input').forEach(i=>{
    const key = i.closest('.check').querySelector('[data-source-count]').dataset.sourceCount;
    const on = state.sources.has(key);
    i.checked = on;
    i.closest('.check').classList.toggle('off', !on);
  });
  refresh();
});
searchEl.addEventListener('input', ()=>{ state.query = searchEl.value; refresh(); });
loadBasePlaces();
loadCustom();
loadRouteCache();
loadFolderPlaces();

// Кнопка «Что рядом» — ленивый запрос соседей
map.on('popupopen', e=>{
  const el = e.popup.getElement();
  if(!el) return;
  const nb = el.querySelector('.nearby-btn');
  if(nb && !nb.dataset.wired){
    nb.dataset.wired = '1';
    nb.addEventListener('click', async ()=>{
      const origin = PLACES.find(x=>x.name===nb.dataset.name);
      const out = el.querySelector('.nearby-out');
      if(!origin || !out) return;
      nb.disabled = true;
      nb.textContent = 'Считаю…';
      const list = await nearbyTimes(origin);
      nb.style.display = 'none';
      if(!list.length){
        out.innerHTML = '<p class="nearby-empty">Рядом ничего нет среди показанных точек — снимите фильтры.</p>';
        return;
      }
      const anyEst = list.some(x=>x.estimated);
      out.innerHTML =
        `<p class="nearby-title">Рядом · <span class="${anyEst?'src-est':'src-live'}">${anyEst?'оценка по прямой':'по дорогам, OSRM'}</span></p>` +
        list.slice(0,8).map(x=>
          `<button class="nearby-item" data-goto="${x.place.name}">
             <span class="ni-dot" style="background:${statusInfo(x.place.cat).color}"></span>
             <span class="ni-name">${x.place.name}</span>
             <span class="ni-min">${fmtMin(x.min)}</span>
           </button>`).join('');
      out.querySelectorAll('[data-goto]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const t = PLACES.find(x=>x.name===b.dataset.goto);
          if(!t) return;
          map.closePopup();
          map.flyTo([t.lat,t.lng], 11, {duration:.6});
          const ref = markerRefs.find(r=>r.place===t);
          if(ref) setTimeout(()=>ref.marker.openPopup(), 650);
        });
      });
    });
  }
  const btn = el.querySelector('.edit-place');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const p = PLACES.find(x=>x.name===btn.dataset.name && x.custom);
    if(p){ map.closePopup(); openModal(p); }
  });
});
</script>
</body>
</html>
