<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Атлас поездок — Загреб и окрестности</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="grain"></div>
  <div id="map-ui">
<section id="hero-card" aria-label="Атлас поездок">
      <img class="travel-atlas-logo" src="assets/img006.png" alt="TRAVEL ATLAS">
      <div class="hero-question">КУДА ПОЕХАТЬ? · ЗАГРЕБ</div>
      <div class="hero-result"><strong id="hero-count">—</strong> мест</div>
      <img class="atlas-tape" src="assets/img007.png" alt="">
      <img class="atlas-shell" src="assets/img008.png" alt="">
      <img class="atlas-star" src="assets/img009.png" alt="">
    </section>
    <div id="map-actions">
      <label class="map-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="place-search" type="search" placeholder="Найти место…" autocomplete="off">
      </label>
      <button class="map-btn map-btn-quiet" id="reset-filters" type="button">Сбросить</button>
      <button class="map-btn map-btn-quiet" id="add-place" type="button">+ Место</button><button class="map-btn map-btn-dark" id="open-filters" type="button">Фильтры</button>
    </div>
  </div>
  <div id="sidebar">
    <div class="drawer-head"><strong>ФИЛЬТРЫ</strong><button class="drawer-close" id="close-filters" type="button" aria-label="Закрыть">×</button></div>
    <img class="filter-tape" src="assets/img010.png" alt="">
    <img class="filter-compass" src="assets/img011.png" alt="">
    <div id="sidebar-header">
      <img class="logo-img" src="assets/img012.png" alt="Атлас поездок">
    </div>

    <button id="filters-toggle">
      Фильтры и настройки
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div id="scroll">
    <div id="controls">
      <div class="field">
        <label for="base-select">Точка отсчёта</label>
        <select id="base-select">
          <option value="zagreb">Загреб</option>
        </select>
      </div>
      <div class="field">
        <label for="mode-select">Способ передвижения</label>
        <select id="mode-select">
          <option value="car">На машине</option>
        </select>
      </div>

      <div class="panel" id="panel-status">
        <button class="panel-head" data-panel="panel-status">
          Статус
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body" id="status-list"></div>
      </div>

      <div class="panel" id="panel-source">
        <button class="panel-head" data-panel="panel-source">
          Источник
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body" id="source-list"></div>
      </div>

      <div class="panel" id="panel-country">
        <button class="panel-head" data-panel="panel-country">
          Страна
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body" id="country-list"></div>
      </div>

      <div class="panel closed" id="panel-season">
        <button class="panel-head" data-panel="panel-season">
          Сезон
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body" id="season-list"></div>
      </div>

      <div class="panel closed" id="panel-cats">
        <button class="panel-head" data-panel="panel-cats">
          Тип места
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body">
          <div class="bulk">
            <button id="cats-all">Выбрать все</button>
            <button id="cats-none">Снять все</button>
          </div>
          <div id="cat-list"></div>
        </div>
      </div>

      <div class="panel" id="panel-marks">
        <button class="panel-head" data-panel="panel-marks">
          Отметки
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="panel-body">
          <label class="check" id="check-return">
            <input type="checkbox" checked>
            <span class="ico" style="color:var(--star)">★</span>
            <span class="txt">Хотим вернуться</span>
            <span class="num" id="count-return"></span>
          </label>
        </div>
      </div>
    </div>

    <div id="list-panel">
      <div id="result-count"></div>
      <div id="list-wrap"></div>
    </div>
    </div>
  </div>
  <img class="edge-collage star" src="assets/img009.png" alt="" aria-hidden="true">
  <img class="edge-collage palm" src="assets/img013.png" alt="" aria-hidden="true">
  <img class="edge-collage castle" src="assets/img015.png" alt="" aria-hidden="true">
  <div id="map"></div>
  <button id="sidebar-collapse" title="Скрыть/показать панель">
    <svg id="collapse-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="collapse-txt">Скрыть панель</span>
  </button>
  <div id="pick-hint">Кликните по карте, чтобы поставить точку</div>
</div>

<div id="modal-back">
  <div id="modal">
    <h2 id="modal-title">Новое место</h2>
    <div class="form-body">
      <div class="fg">
        <label for="f-name">Название</label>
        <input type="text" id="f-name" placeholder="Например: Гарич-град">
      </div>

      <div class="fg">
        <label for="f-q">Название на местном языке (для поиска)</label>
        <input type="text" id="f-q" placeholder="Например: Garić grad">
      </div>

      <div class="coord-row">
        <div class="fg">
          <label for="f-lat">Широта</label>
          <input type="text" id="f-lat" placeholder="45.8150">
        </div>
        <div class="fg">
          <label for="f-lng">Долгота</label>
          <input type="text" id="f-lng" placeholder="15.9819">
        </div>
        <button id="pick-btn" type="button">На карте</button>
      </div>
      <div style="height:15px"></div>

      <div class="fg">
        <label for="f-status">Статус</label>
        <select id="f-status"></select>
      </div>

      <div class="fg">
        <label for="f-country">Страна</label>
        <select id="f-country"></select>
      </div>

      <div class="fg">
        <label for="f-season">Сезон</label>
        <select id="f-season"></select>
      </div>

      <div class="fg">
        <label>Тип места (можно несколько)</label>
        <div class="cat-grid" id="f-cats"></div>
      </div>

      <div class="fg">
        <label for="f-drive">Время в пути</label>
        <input type="text" id="f-drive" placeholder="1 ч 15 мин">
      </div>

      <div class="fg">
        <label for="f-note">Описание / впечатление</label>
        <textarea id="f-note" placeholder="Что там интересного"></textarea>
      </div>

      <div class="fg">
        <label for="f-warn">Проверить перед выездом (необязательно)</label>
        <input type="text" id="f-warn" placeholder="Например: закрыто по понедельникам">
      </div>

      <div class="fg">
        <label for="f-meta">Заметка о поездке (необязательно)</label>
        <input type="text" id="f-meta" placeholder="Например: окт · авто">
      </div>

      <label class="check" style="padding-left:0;">
        <input type="checkbox" id="f-return">
        <span class="ico" style="color:var(--star)">★</span>
        <span class="txt">Хотим вернуться</span>
      </label>

      <div id="del-wrap" style="display:none;margin-top:8px;">
        <button class="del-link" id="del-btn">Удалить это место</button>
      </div>
    </div>
    <div class="form-err" id="form-err"></div>
    <div class="form-actions">
      <button id="cancel-btn" type="button">Отмена</button>
      <button id="save-btn" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
